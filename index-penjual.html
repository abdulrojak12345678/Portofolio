<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Penjual</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="module">
    import { ambilDaftarPenjual, hapusPenjual } from './main.js';

    $(document).ready(async function () {
      let elemenDaftar = $('#daftar-penjual > tbody');
      let daftarPenjual = await ambilDaftarPenjual();
      let nomor = 1;

      daftarPenjual.forEach((data) => {
        elemenDaftar.append(
          '<tr>' +
          '<th>' + nomor + '</th>' +
          '<td>' + data.nama + '</td>' +
          '<td>' + data.alamat + '</td>' +
          '<td>' + data.gmail + '</td>' +
          '<td>' + data.noTlpn + '</td>' +
          '<td>' +
          ' <a href="#" class="btn btn-warning btn-sm link-ubah" data="' + data.id + '">Ubah</a> ' +
          ' <button class="btn btn-danger btn-sm tombol-hapus" data="' + data.id + '">Hapus</button>' +
          '</td>' +
          '</tr>'
        );
        nomor++;
      });

      $('.tombol-hapus').click(async function () {
        await hapusPenjual($(this).attr('data'));
        location.reload();
      });

      $('.link-ubah').click(function () {
        window.location.replace('ubah-Penjual.html?docId=' + $(this).attr('data'));
      });

      $('#loader').hide();
    });
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #fdfbfb, #ebedee);
    }
    header img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
    }
    h1 {
      margin: 20px 0;
    }
    table {
      background-color: #ffffff;
    }
  </style>
</head>

  <div class="container">
    <h1 class="text-center">Daftar Penjual</h1>

    <div class="mb-3 text-end">
      <a href="form-penjual.html" class="btn btn-primary">+ Tambah Penjual</a>
      <a href="UTAMA.html" class="btn btn-secondary">Beranda</a>
    </div>

    <table class="table table-bordered table-striped" id="daftar-penjual">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Nama</th>
          <th>Alamat</th>
          <th>Email</th>
          <th>No. Telepon</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <div class="text-center">
      <img src="loader.gif" style="width: 2em; display: none" id="loader">
    </div>
  </div>

  <footer class="py-4 bg-dark text-light text-center mt-5">
    <div class="container">
      <p class="mb-0">&copy; 2024 SMK Plus Insan Cemerlang | KAF Group Indonesia</p>
    </div>
  </footer>
</body>

</html>
