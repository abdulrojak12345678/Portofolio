<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stok PKL - KAF Group Indonesia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="module">
    import { ambilDaftarBarang, ubahBarang, hapusBarang } from './main.js';

    $(document).ready(async function () {
      let elemenDaftar = $("#barang > tbody");
      let daftarBarang = await ambilDaftarBarang();
      let nomor = 1;

      daftarBarang.forEach((data) => {
        elemenDaftar.append(
          '<tr>' +
          '<th>' + nomor + '</th>' +
          '<td>' + data.tanggalMasuk + '</td>' +
          '<td>' + data.namaBarang + '</td>' +
          '<td>' + data.jumlahBarang + '</td>' +
          '<td>' +
          ' <a href="#" class="btn btn-warning btn-sm link-ubah" data="' + data.id + '">Ubah</a> ' +
          ' <button class="btn btn-danger btn-sm tombol-hapus" data="' + data.id + '">Hapus</button>' +
          '</td>' +
          '</tr>'
        );
        nomor++;
      });

      $('.tombol-hapus').click(async function () {
        await hapusBarang($(this).attr('data'));
        location.reload();
      });

      $('.link-ubah').click(function () {
        window.location.replace('ubah-pkl.html?docId=' + $(this).attr('data'));
      });

      $('#loader').hide();
    });
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }
    h1 {
      margin-bottom: 10px;
    }
    table {
      background-color: white;
    }
    header img {
      width: 80%;
      max-height: 400px;
      object-fit: cover;
    }
  </style>
</head>

<body class="m-3">
  <header class="text-center mb-4">
    <img src="gambar.jpg" alt="Header Gambar">
  </header>

  <div class="container">
    <h1 class="text-center">Stok Bahan Baku KAF Group Indonesia</h1>

    <div class="mb-3 text-end">
      <a href="form-pkl.html" class="btn btn-primary">+ Tambah Data</a>
      <a href="UTAMA.html" class="btn btn-secondary">Beranda</a>
    </div>

    <table class="table table-bordered table-striped" id="barang">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Tanggal Masuk</th>
          <th>Nama Barang</th>
          <th>Jumlah Barang</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <div class="text-center">
      <img src="loader.gif" style="width: 2em; display: none" id="loader">
    </div>
  </div>

  <footer class="py-4 bg-dark text-light text-center mt-5">
    <div class="container">
      <p class="mb-0">&copy; 2024 SMK Plus Insan Cemerlang | PT. KAF Group Indonesia</p>
    </div>
  </footer>
</body>

</html>
